<!DOCTYPE html>
<html lang="fr">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TGWN - By Maxonsss</title>

    <!-- Doit être chargé avant les autres scripts -->

    <style>

            terminal
